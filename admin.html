<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理者 | RedLine Customs</title><link rel="stylesheet" href="/style.css"></head><body><header><div><h1>🔧 RedLine Customs 管理者</h1></div><nav><a href="/">料金計算</a><button id="logoutBtn" class="ghost">ログアウト</button></nav></header><main><section class="card"><h2>料金表管理</h2><form id="productForm" class="grid"><input type="hidden" id="productId"><label>カテゴリ<input id="category" required></label><label>商品名<input id="name" required></label><label>価格<input id="price" type="number" min="0" required></label><label>PD/EMS半額<select id="half"><option value="1">対象</option><option value="0">対象外</option></select></label><label>最大数量<input id="maxQty" type="number" min="1" placeholder="無制限"></label><label>並び順<input id="sortOrder" type="number" value="0"></label><div><button>保存</button><button type="button" id="clearProduct" class="secondary">新規入力</button></div></form><div id="productsTable"></div></section><section class="card"><h2>スタッフ管理</h2><form id="userForm" class="grid"><label>ユーザー名<input id="uUsername" required></label><label>表示名<input id="uDisplay" required></label><label>初期パスワード<input id="uPassword" type="password" minlength="8" required></label><label>権限<select id="uRole"><option value="staff">staff</option><option value="admin">admin</option></select></label><div><button>スタッフ追加</button></div></form><div id="usersTable"></div></section><section class="card"><h2>作業履歴</h2><div class="actions"><button id="exportLogs">作業履歴CSV</button><button id="exportProducts" class="secondary">料金表CSV</button><button id="exportUsers" class="secondary">スタッフ一覧CSV</button></div><div id="logsTable"></div></section></main><script src="/admin.js"></script></body></html>
