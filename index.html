<!doctype html>

<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>RedLine Customs 料金計算</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<header>
    <div>
        <h1>🔧 RedLine Customs</h1>
        <p>料金計算システム</p>
    </div>

```
<nav>
    <a href="/password.html">パスワード変更</a>
    <button id="logoutBtn" class="ghost">ログアウト</button>
</nav>
```

</header>

<main>

```
<!-- スタッフ情報・顧客区分 -->
<section class="card">
    <div class="row between">

        <div>
            <strong id="staffName">読み込み中…</strong>
            <span id="roleBadge" class="badge"></span>
        </div>

        <div class="tabs">
            <button class="tab active" data-type="general">
                一般
            </button>

            <button class="tab" data-type="pd">
                PD
            </button>

            <button class="tab" data-type="ems">
                EMS
            </button>
        </div>

    </div>
</section>

<!-- 商品・整備項目 -->
<section id="products"></section>

<!-- 合計 -->
<section class="card total">

    <div>
        <span>合計</span>
        <strong id="total">$0</strong>
    </div>

    <div class="actions">

        <button id="copyBill">
            合計金額をコピー
        </button>

        <button id="copyThanks" class="secondary">
            お礼文をコピー
        </button>

        <button id="saveLog" class="success">
            作業履歴を保存
        </button>

    </div>

    <textarea
        id="output"
        readonly
        placeholder="コピー内容の確認"
    ></textarea>

</section>

<!-- 管理者メニュー -->
<section id="adminLink" class="card hidden">

    <h2>管理者メニュー</h2>

    <a
        class="button"
        href="/admin.html"
    >
        料金表・スタッフ・履歴管理
    </a>

</section>
```

</main>

<script src="/app.js"></script>

</body>
</html>
